spring:
  application:
    name: ${OTEL_SERVICE_NAME:orders-spring-app}

  datasource:
    url: jdbc:sqlserver://${SQL_SERVER}:${SQL_SERVER_PORT};database=${SQL_DATABASE};user=[${SQL_USERNAME}]@${SQL_SERVER_NAME};password=${SQL_PASSWORD};encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;
    username: ${SQL_USERNAME}
    password: ${SQL_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      connection-timeout: 5000
      initialization-fail-timeout: -1
      connection-test-query: SELECT 1
      keepalive-time: 30000
  jpa:
    hibernate:
      ddl-auto: none
    # Deliberately false: show-sql writes straight to System.out, which the OTel
    # agent does not instrument, so those lines never reach New Relic. The
    # org.hibernate.SQL logger below goes through Logback, which the agent does
    # instrument.
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

# Como alcanza este servicio la API de usuarios: NO directamente, sino a traves
# del gateway de Tyk. Estas son las variables propias de orders.
gateway:
  # Base del gateway, sin barra final. Sin valor por defecto util en Azure: el
  # FQDN de Container Apps no es predecible, hay que pasarlo.
  url: ${GATEWAY_BASE_URL:https://localhost:8443}
  # Listen path con el que el gateway publica la API de usuarios.
  users-path: ${GATEWAY_USERS_PATH:/api-users/v1}
  # Credenciales de CONSUMIDOR del gateway, no el Basic Auth de users: Tyk
  # sustituye la cabecera antes de reenviar al upstream. Sin valor por defecto,
  # por el mismo motivo que en app.security.
  username: ${GATEWAY_BASIC_USER}
  password: ${GATEWAY_BASIC_PASSWORD}

app:
  security:
    # Credenciales que este servicio exige a quien le llama. Se emplea el mismo
    # nombre que en microservice-users por tratarse del mismo concepto.
    #
    # Sin valor por defecto: con ${BASIC_AUTH_USER:admin} el servicio arrancaria
    # con admin/password cuando falte la variable, en lugar de fallar, y un
    # despliegue incompleto quedaria accesible con una credencial conocida.
    username: ${BASIC_AUTH_USER}
    password: ${BASIC_AUTH_PASSWORD}
  force-errors:
    # Endpoint /force-errors, que devuelve el codigo de error solicitado. Sirve
    # para validar alertas y paneles sin esperar a un fallo real.
    #
    # Queda detras del Basic Auth, como el resto, pero permite a cualquier
    # consumidor autenticado provocar respuestas 5xx. Con false responde 404,
    # para no revelar que la ruta existe.
    enabled: ${FORCE_ERRORS_ENABLED:true}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      cache:
        time-to-live: 30s
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:local}

logging:
  level:
    root: INFO
    com.example: ${LOG_LEVEL:INFO}
    # DEBUG por defecto, pero gobernado por la variable LOG_LEVEL. Con un valor
    # fijo, este logger, mas especifico, prevalece sobre com.example y LOG_LEVEL
    # no surte efecto.
    com.example.ordersapp: ${LOG_LEVEL:DEBUG}
    # Cada sentencia que ejecuta Hibernate, como registro de log correlacionado
    # con su traza. Se activa con SQL_LOG_LEVEL=DEBUG.
    # The logger name is declared here and not as a LOGGING_LEVEL_ORG_HIBERNATE_SQL
    # app setting on purpose: relaxed binding lowercases environment variable
    # names, and "org.hibernate.sql" is a different logger than "org.hibernate.SQL".
    org.hibernate.SQL: ${SQL_LOG_LEVEL:INFO}
    # Bind parameter values. Only useful with SQL_LOG_LEVEL=DEBUG, and it prints
    # the data sent to the database, so keep it off unless you are debugging.
    org.hibernate.orm.jdbc.bind: ${SQL_BIND_LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
