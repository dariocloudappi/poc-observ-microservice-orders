spring:
  application:
    name: ${OTEL_SERVICE_NAME:orders-spring-app}

  datasource:
    url: jdbc:sqlserver://${SQL_SERVER}:${SQL_SERVER_PORT};database=${SQL_DATABASE};user=[${SQL_USERNAME}]@${SQL_SERVER_NAME};password=${SQL_PASSWORD};encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;
    username: ${SQL_USERNAME}
    password: ${SQL_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      connection-timeout: 5000
      initialization-fail-timeout: -1
      connection-test-query: SELECT 1
      keepalive-time: 30000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

users:
  service:
    url: ${USERS_SERVICE_URL:http://localhost:8081}
    username: ${USERS_SERVICE_USERNAME:admin}
    password: ${USERS_SERVICE_PASSWORD:password}

api:
  security:
    username: ${API_USERNAME:admin}
    password: ${API_PASSWORD:password}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      cache:
        time-to-live: 30s
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:local}

logging:
  level:
    root: INFO
    com.example: ${LOG_LEVEL:INFO}
    com.example.ordersapp: DEBUG
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
